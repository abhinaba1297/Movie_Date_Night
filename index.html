<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Movie Date Night for My Queen 💌</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="floating-layer" id="floatingLayer"></div>

  <main class="phone">
    <header class="hero">
      <div class="badge">São Paulo ↔ San Diego</div>

      <h1 id="title">A movie date proposal for my queen</h1>

      <p id="subtitle">
        Because you miss me today, because it is Friday, I miss you too amor, and because tonight deserves pizza, FaceTime, and us.
      </p>

      <div class="date-card">
        <div>
          <span class="label">Tonight</span>
          <strong>9:45 PM São Paulo</strong>
        </div>

        <div>
          <span class="label">San Diego</span>
          <strong>5:45 PM</strong>
        </div>

        <div>
          <span class="label">Location</span>
          <strong>FaceTime</strong>
        </div>
      </div>

      <div class="movie-card">
        🎬 Movie: <strong>Drawn Together</strong> &nbsp; 🍕 Dinner: <strong>Pizza date</strong>
      </div>
    </header>

    <section class="stage" id="stage">
      <div class="media-peek" id="mediaPeek"></div>

      <div class="question" id="question"></div>

      <div class="choices" id="choices"></div>

      <p class="hint" id="hint"></p>
    </section>

    <footer>
      <button id="backBtn" class="ghost" type="button">← Back</button>
      <button id="memoryBtn" class="ghost" type="button">Random Gramado memory ✨</button>
      <button id="restartBtn" class="ghost" type="button">Restart ↻</button>
    </footer>
  </main>

  <audio id="bgMusic" preload="auto" loop playsinline>
    <source src="./song.mp3" type="audio/mpeg">
  </audio>

  <script src="script.js"></script>
</body>
</html>
